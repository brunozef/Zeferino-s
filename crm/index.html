<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeferino's CRM</title>

<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="/crm/zcrm-icon-180.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="/crm/zcrm-icon-192.png?v=2">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --navy:#161514;--navy2:#2a2622;--amber:#b8956a;--amber2:#806340;--amber-l:#d2b48a;--bg:#f3f0ea;--card:#fbfaf7;
  --ink:#1c1a17;--mute:#6b655c;--line:#e2ddd3;--serif:'Playfair Display',Palatino,Georgia,serif;--ok:#1f8a4c;--warn:#b7791f;--bad:#c0392b;--info:#2b6cb0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:220px;background:var(--navy);color:#dfe5f0;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh}
.brand{padding:22px 16px 16px;border-bottom:1px solid rgba(184,149,106,.25);text-align:center}
.brand img{width:100%;display:block}
.brand .zl{width:64px;margin:0 auto 10px;border-radius:4px}
.brand span{display:block;font-size:10px;color:var(--amber-l);letter-spacing:2.5px;text-transform:uppercase;margin-top:8px}
.mtop{display:none}
.badge{background:#c0392b;color:#fff;border-radius:999px;font-size:10px;padding:1px 6px;margin-left:auto}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#d9d2c5;text-decoration:none;font-weight:500}
.nav a:hover{background:var(--navy2);color:#fff}
.nav a.on{background:linear-gradient(135deg,#d2b48a,#b8956a 55%,#806340);color:#161514}
.nav svg{width:18px;height:18px;flex-shrink:0}
.side .foot{margin-top:auto;padding:14px 18px;font-size:11px;color:#8b97ad}
.main{flex:1;min-width:0;padding:24px 28px 90px}
h1{font-family:var(--serif);font-size:26px;font-weight:600;margin:0 0 4px;color:var(--navy)}
.kpi .v,.modal h2{font-family:var(--serif)}
.sub{color:var(--mute);margin:0 0 20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi .l{font-size:12px;color:var(--mute);font-weight:500}
.kpi .v{font-size:24px;font-weight:700;margin-top:6px}
.kpi .s{font-size:12px;color:var(--mute);margin-top:2px}
.two{grid-template-columns:1fr 1fr}
@media(max-width:1000px){.two{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#c5cad3}
.btn.p{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.p:hover{background:var(--navy2)}
.btn.a{background:linear-gradient(135deg,#d2b48a,#b8956a 55%,#9a7a4f);border-color:#9a7a4f;color:#161514;font-weight:600}
.btn.a:hover{filter:brightness(1.07)}
.btn.d{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
textarea{resize:vertical;min-height:60px}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(184,149,106,.35);border-color:var(--amber)}
label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-bottom:4px}
.f{margin-bottom:12px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:#fafbfc}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:#eef0f4;color:#475467;white-space:nowrap}
.t-draft{background:#eef0f4;color:#475467}.t-sent{background:#e6effa;color:var(--info)}
.t-approved,.t-paid,.t-signed,.t-done{background:#e3f4ea;color:var(--ok)}
.t-declined,.t-cancelled,.t-overdue{background:#fbe9e7;color:var(--bad)}
.t-partial,.t-scheduled{background:#fdf3e1;color:var(--warn)}
.muted{color:var(--mute)}
.small{font-size:12px}
.empty{padding:30px;text-align:center;color:var(--mute)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--navy);border-color:var(--amber)}
.banner{background:#fff6e6;border:1px solid #f2d39a;color:#7a5410;padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:13px}
.cat-h td{background:#f8f9fb;font-weight:700;color:var(--navy);font-size:13px}
.price-in{width:90px;text-align:right;padding:5px 8px}
.lines td{padding:6px}
.lines input,.lines textarea,.lines select{padding:6px 8px}
.lines textarea{min-height:38px;font-size:12px}
.tot{margin-left:auto;max-width:340px;width:100%}
.tot div{display:flex;justify-content:space-between;padding:5px 0}
.tot .big{font-size:18px;font-weight:700;border-top:2px solid var(--navy);margin-top:6px;padding-top:8px}
.modal-bg{position:fixed;inset:0;background:rgba(15,20,35,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{max-width:900px}
.modal h2{margin:0 0 14px;font-size:18px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;z-index:60;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;font-weight:600;color:var(--mute);text-align:center;padding:4px}
.cal .d{min-height:78px;border:1px solid var(--line);border-radius:8px;padding:5px;background:#fff;cursor:pointer;font-size:12px;overflow:hidden}
.cal .d.o{background:#fafbfc;color:#b0b6c1}
.cal .d.t{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.cal .d.sel{background:#f6efe3}
.cal .ev{display:block;margin-top:3px;padding:2px 5px;border-radius:4px;background:#e6effa;color:var(--info);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.cal .ev.svc{background:#fdf3e1;color:var(--warn)}
.cal .ev.done{background:#e3f4ea;color:var(--ok)}
.picker-list{max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.pick{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;justify-content:space-between}
.pick:hover{background:#f6efe3}
.pick .n{font-weight:600}
.pick .r{text-align:right;white-space:nowrap;font-size:12px}
.doc-prev{border:1px solid var(--line);border-radius:10px;padding:24px;background:#fff;font-size:13px}
.doc-prev h3{margin:0;font-size:20px;color:var(--navy);font-family:var(--serif)}
.doc-head{background:#161514;margin:-24px -24px 18px;padding:16px 24px;border-radius:10px 10px 0 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
.doc-head img{height:34px}
.doc-head .k{color:#d2b48a;font-family:var(--serif);font-size:22px;letter-spacing:2px}
.lead{border-left:3px solid var(--amber);padding:12px;background:#fff;border-radius:8px;margin-top:10px}
.clause{margin:10px 0}
.clause b{color:var(--navy)}
.lien{border:2px solid var(--ink);padding:10px;font-size:11px;font-weight:600;margin-top:14px}
.hide-m{}
.login{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#2a2622,#161514 60%,#0b0b0a);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px}
.login .box{width:100%;max-width:360px;text-align:center}
.login img{mix-blend-mode:lighten}.login img.ic{width:150px;border-radius:34px;margin-bottom:14px;mix-blend-mode:normal;box-shadow:0 10px 30px rgba(0,0,0,.6)}.login img.z{width:110px;margin-bottom:14px}.login img.w{width:240px;display:block;margin:0 auto 6px}
.login .tg{color:#d2b48a;letter-spacing:3px;font-size:11px;text-transform:uppercase;margin-bottom:26px}
.login input{background:#1f1d1a;border-color:#3a352f;color:#f3f0ea;margin-bottom:10px;padding:12px}
.login .btn{width:100%;padding:12px}
.login .err{color:#f0a49a;font-size:13px;min-height:18px;margin:6px 0}
.install{position:fixed;right:16px;bottom:16px;z-index:45}
@media(max-width:760px){.install{bottom:80px}}
@media(max-width:760px){
  .side{position:fixed;bottom:0;top:auto;left:0;right:0;width:100%;height:auto;z-index:40;flex-direction:row}
  .brand,.side .foot{display:none}
  .mtop{display:flex;align-items:center;justify-content:center;gap:10px;background:#161514;padding:10px;margin:-16px -12px 16px}
  .mtop img{height:26px}
  .badge{position:absolute;margin-left:18px;margin-top:-4px}
  .nav a{position:relative}
  .nav{flex-direction:row;justify-content:space-around;width:100%;padding:6px 4px}
  .nav a{flex-direction:column;gap:2px;padding:6px 4px;font-size:10px;flex:1;justify-content:center;text-align:center}
  .main{padding:16px 12px 90px}
  .hide-m{display:none}
  .lines thead{display:none}
  .lines tr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;border-bottom:1px solid var(--line);padding:6px 0}
  .lines td{border:0}
  .lines td.wide{grid-column:1/-1}
}
</style>
</head>

    <nav class="nav" id="nav"></nav>
    <div class="foot">Dados salvos automaticamente<br><a href="#" style="color:#b8956a" onclick="event.preventDefault();logout()">Sair</a></div>
  </aside>
  <main class="main" id="main"></main>
</div>

function totals(d){
  let labor=0,mat=0;
  for(const l of d.lines||[]){const a=(+l.qty||0)*(+l.rate||0); if(l.type==='material') mat+=a; else labor+=a;}
  const tax=mat*(+d.taxRate||0)/100, disc=+d.discount||0;
  const total=labor+mat+tax-disc;
  const paid=(d.payments||[]).reduce((s,p)=>s+(+p.amount||0),0);
  return {labor,mat,tax,disc,total,paid,balance:total-paid,deposit:total*(+d.depositPct||0)/100};
}

function effStatus(d){

}

function parseForm(txt){
  const map={name:'name',nome:'name','full name':'name',phone:'phone',telefone:'phone',email:'email','e-mail':'email',city:'city',cidade:'city',address:'address','endereço':'address',service:'service','serviço':'service',servico:'service','project details':'project',details:'project',message:'project',mensagem:'project',project:'project'};
  const out={};let last=null;
  for(const line of String(txt).split(/\r?\n/)){
    const m=line.match(/^\s*([^:]{2,30}?)\s*:\s*(.*)$/);
    const k=m&&map[m[1].trim().toLowerCase()];
    if(k){out[k]=m[2].trim();last=k}
    else if(last==='project'&&line.trim()) out.project=(out.project?out.project+'\n':'')+line.trim();
  }
  return out;
}
function gmailErr(e){
  const c=e&&e.code;
  if(c==='needs_reauth') return 'Reconecte o Gmail em claude.ai → Configurações → Conectores';
  if(c==='server_not_connected'||c==='selection_required') return 'Conecte o Gmail da Zeferino\'s em claude.ai → Configurações → Conectores';
  if(c==='not_in_manifest'||c==='approval_required'||c==='consent_required') return 'Permita o acesso ao Gmail para buscar leads (clique em “Verificar e-mail agora”)';
  if(c==='server_unavailable') return 'Gmail não respondeu agora — tente de novo em instantes';
  return 'Não foi possível verificar o e-mail agora';
}
let mcp=true;
async function importLeads(manual){
  if(!USER||S.importing)return; S.importing=true; if(S.view==='leads')render();
  try{
    const {data,error}=await sb.from('leads').select('*').eq('status','new').order('created_at',{ascending:true}).limit(100);
    if(error) throw error;
    let added=0;
    for(const l of data||[]){
      const id='lead-'+l.id;
      if(!S.clients[id]){
        await put('clients',{id,name:l.name||'(sem nome)',phone:l.phone||'',email:l.email||'',city:l.city||'',state:'FL',address:'',service:l.service||'',project:l.details||'',source:l.source==='cleaning'?'Site – limpeza':'Site (formulário)',type:'Homeowner',lead:true,leadStatus:'new',leadDate:l.created_at,updatedAt:new Date().toISOString()});
        added++;
      }
      await sb.from('leads').update({status:'imported'}).eq('id',l.id);
    }
    S.leadMsg='Verificado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    if(added){toast(added+' lead(s) novo(s) do site!');try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
    else if(manual)toast('Nenhum lead novo');
  }catch(e){S.leadMsg='Não foi possível verificar os leads agora';if(manual)toast(S.leadMsg)}
  S.importing=false;render();
}

/* ---------- Agenda ---------- */
function vAgenda(){
  const t=today(); if(!S.calMonth) S.calMonth=t.slice(0,7); if(!S.calSel) S.calSel=t;
  const [y,mo]=S.calMonth.split('-').map(Number);
  const first=new Date(y,mo-1,1), start=new Date(first); start.setDate(1-first.getDay());
  const jobs=Object.values(S.jobs);
  let cells='';
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const evs=jobs.filter(j=>j.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    cells+=`<div class="d ${d.getMonth()!==mo-1?'o':''} ${ds===t?'t':''} ${ds===S.calSel?'sel':''}" onclick="S.calSel='${ds}';render()"><b>${d.getDate()}</b>${evs.slice(0,3).map(j=>`<span class="ev ${j.status==='done'?'done':j.type==='service'?'svc':''}">${esc(j.time||'')} ${esc(clientName(j.clientId)!=='—'?clientName(j.clientId):j.title||'')}</span>`).join('')}${evs.length>3?`<span class="small muted">+${evs.length-3}</span>`:''}</div>`;
  }
  const dayJobs=jobs.filter(j=>j.date===S.calSel).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const mName=first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  return `<div class="row spread"><div><h1>Agenda</h1><p class="sub">Visitas, medições e dias de obra</p></div><button class="btn a" onclick="editJob(null,null,S.calSel)">+ Agendar</button></div>
  <div class="grid two" style="grid-template-columns:2fr 1fr">
  <div class="card"><div class="row spread" style="margin-bottom:10px"><button class="btn sm" onclick="shiftMonth(-1)">‹</button><b style="text-transform:capitalize">${mName}</b><button class="btn sm" onclick="shiftMonth(1)">›</button></div>
   <div class="cal">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>`<div class="h">${x}</div>`).join('')}${cells}</div></div>
  <div class="card"><b>${fmtDpt(S.calSel)}</b>
   ${dayJobs.length?dayJobs.map(j=>`<div class="card" style="margin-top:10px;padding:12px;cursor:pointer" onclick="editJob('${j.id}')"><div class="row spread"><b>${esc(j.time||'Dia todo')}</b><span class="tag ${j.status==='done'?'t-done':j.type==='service'?'t-scheduled':'t-sent'}">${j.status==='done'?'Feito':JTYPES[j.type]}</span></div><div style="margin-top:4px">${esc(j.title||'')}</div><div class="small muted">${esc(clientName(j.clientId))}${j.address?' · '+esc(j.address):''}</div></div>`).join(''):'<div class="empty">Nada neste dia.</div>'}
   <button class="btn" style="margin-top:12px;width:100%" onclick="editJob(null,null,S.calSel)">+ Agendar neste dia</button>
  </div></div>`;
}
function shiftMonth(n){const [y,m]=S.calMonth.split('-').map(Number);const d=new Date(y,m-1+n,1);S.calMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}
function clientOptions(sel){return `<option value="">— selecione —</option>`+Object.values(S.clients).sort((a,b)=>(a.name||'').localeCompare(b.name||'')).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}${c.company?' ('+esc(c.company)+')':''}</option>`).join('')}
function editJob(id,clientId,date){
  const j=id?clone(S.jobs[id]):{id:uid(),type:'visit',date:date||today(),time:'09:00',clientId:clientId||'',status:'scheduled'};
  if(!id&&j.clientId){const c=S.clients[j.clientId];if(c)j.address=[c.address,c.city].filter(Boolean).join(', ')}
  modal(`<h2>${id?'Editar agendamento':'Novo agendamento'}</h2><form id="jf">
  <div class="fg"><div class="f"><label>Cliente</label><select name="clientId" onchange="const c=S.clients[this.value];if(c&&!this.form.address.value)this.form.address.value=[c.address,c.city].filter(Boolean).join(', ')">${clientOptions(j.clientId)}</select></div>
  <div class="f"><label>Tipo</label><select name="type">${Object.entries(JTYPES).map(([k,v])=>`<option value="${k}" ${j.type===k?'selected':''}>${v}</option>`).join('')}</select></div></div>
  <div class="f"><label>Título</label><input name="title" placeholder="Ex.: Medir baseboard e crown – sala e quartos" value="${esc(j.title||'')}"></div>
  <div class="fg"><div class="f"><label>Data</label><input type="date" name="date" required value="${esc(j.date)}"></div><div class="f"><label>Hora</label><input type="time" name="time" value="${esc(j.time||'')}"></div><div class="f"><label>Até (data final, opcional)</label><input type="date" name="endDate" value="${esc(j.endDate||'')}"></div></div>
  <div class="f"><label>Endereço da obra</label><input name="address" value="${esc(j.address||'')}"></div>
  <div class="f"><label>Observações</label><textarea name="notes">${esc(j.notes||'')}</textarea></div>
  <div class="f"><label><input type="checkbox" name="done" style="width:auto" ${j.status==='done'?'checked':''}> Concluído</label></div>
  <div class="row spread"><div>${id?`<button type="button" class="btn d" onclick="confirmDel('jobs','${id}','este agendamento')">Excluir</button>`:''}</div><div class="row"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn p">Salvar</button></div></div></form>`);
  $('#jf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);
    for(const k of ['clientId','type','title','date','time','endDate','address','notes']) j[k]=(f.get(k)||'').trim();
    j.status=f.get('done')?'done':'scheduled';
    const extra=[];
    if(j.endDate&&j.endDate>j.date){ // gera um registro por dia
      let d=addDays(j.date,1); let g=j.group||j.id; j.group=g;
      while(d<=j.endDate){extra.push({...j,id:g+'-'+d,date:d,endDate:''});d=addDays(d,1)}
      j.endDate='';
    }
    put('jobs',j); extra.forEach(x=>put('jobs',x)); closeModal(); toast('Agendamento salvo')};
}

async function newDoc(kind,clientId,from){
  const st=S.settings, t=today();
  const d=from?clone(from):{lines:[],taxRate:st.taxRate,depositPct:st.depositPct,discount:0};
  d.id=uid(); d.kind=kind; d.status='draft'; d.date=t; d.payments=[];
  d.clientId=clientId||d.clientId||'';
  if(from){d.sourceId=from.id; d.sourceNumber=from.number}
  if(!d.jobAddress&&d.clientId){const c=S.clients[d.clientId];if(c)d.jobAddress=[c.address,c.city,c.state,c.zip].filter(Boolean).join(', ')}
  if(kind==='estimate'){d.validUntil=addDays(t,+st.validDays||30);d.terms=st.estTerms}
  if(kind==='contract'){d.terms='';d.schedule=st.schedule;d.startDate=d.startDate||addDays(t,7);d.lien=true;d.warranty=st.warranty}
  if(kind==='invoice'){d.dueDate=addDays(t,+st.dueDays||15);d.terms=st.invTerms}
  d.number='(novo)';
  S.view='documentos';S.docTab=kind;S.docId=null;S.edit=d;closeModal();render();window.scrollTo(0,0);
}

  const d=S.edit; if(!d) return;
  d.lines.forEach((l,i)=>{const el=document.getElementById('amt-'+i);if(el)el.textContent=money((+l.qty||0)*(+l.rate||0))});
  const t=totals(d), el=$('#tot'); if(!el) return;
  el.innerHTML=`<div><span>Mão de obra</span><span>${money(t.labor)}</span></div>${t.mat?`<div><span>Materiais</span><span>${money(t.mat)}</span></div><div><span>Imposto (${d.taxRate}%)</span><span>${money(t.tax)}</span></div>`:''}${t.disc?`<div><span>Desconto</span><span>-${money(t.disc)}</span></div>`:''}<div class="big"><span>Total</span><span>${money(t.total)}</span></div>${d.kind!=='invoice'&&d.depositPct?`<div class="muted"><span>Depósito ${d.depositPct}%</span><span>${money(t.deposit)}</span></div>`:''}`;
}
function addLine(type,s){S.edit.lines.push(s?{sid:s.id,name:s.n,desc:s.d,unit:s.u,qty:1,rate:s.p,type:'labor'}:{name:type==='material'?'Materials':'',desc:'',unit:type==='material'?'LS':'EA',qty:1,rate:0,type});render()}
function rmLine(i){S.edit.lines.splice(i,1);render()}
function mvLine(i,dir){const L=S.edit.lines,j=i+dir;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];render()}
function pickSvc(){
  modal(`<h2>Adicionar do catálogo</h2><input id="pq" placeholder="Buscar: baseboard, door, tile, drywall…" autofocus style="margin-bottom:10px"><div class="picker-list" id="pl"></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" onclick="closeModal()">Fechar</button></div>`,true);
  const draw=()=>{const q=$('#pq').value.toLowerCase();const all=services().filter(s=>!q||[s.n,s.d,s.pt].join(' ').toLowerCase().includes(q));
    let h='';for(const k of Object.keys(CATS)){const g=all.filter(s=>s.c===k);if(!g.length)continue;h+=`<div class="pick" style="background:#f8f9fb;cursor:default;font-weight:700;color:var(--navy)">${CATS[k]}</div>`+g.map(s=>`<div class="pick" onclick="addLine('labor',svc('${s.id}'));toast('Adicionado: ${esc(s.n).replace(/'/g,'')}')"><div><div class="n">${esc(s.n)}</div><div class="small muted">${esc(s.pt||s.d)}</div></div><div class="r"><b>${money(s.p)}</b> / ${s.u}${s.lo!=null?`<div class="muted">${money(s.lo)}–${money(s.hi)}</div>`:''}</div></div>`).join('')}
    $('#pl').innerHTML=h||'<div class="empty">Nada encontrado.</div>'};
  $('#pq').oninput=draw; draw();
}
async function saveEdit(){
  const d=S.edit; d.clientId=$('#e-client').value;
  if(!d.clientId){toast('Selecione o cliente');return}
  if(!d.lines.length){toast('Adicione pelo menos um item');return}
  if(d.number==='(novo)') d.number=await nextNumber(d.kind);
  d.updatedAt=new Date().toISOString();
  const id=d.id; S.edit=null; S.docId=id; await put('docs',d); toast(KINDS[d.kind].pt+' salvo');
}

function convert(id,kind){newDoc(kind,null,S.docs[id])}
function depositInvoice(id){
  const s=S.docs[id],t=totals(s),pct=+s.depositPct||0;
  if(!pct){toast('Defina o % de depósito primeiro');return}
  newDoc('invoice',null,{...clone(s),lines:[{name:`Deposit (${pct}%) – ${s.number}`,desc:`Deposit per ${s.kind==='contract'?'contract':'estimate'} ${s.number}${s.title?' – '+s.title:''}. Contract total ${money(t.total)}.`,unit:'LS',qty:1,rate:Math.round(t.deposit*100)/100,type:'labor'}],taxRate:0,discount:0});
}
function progressInvoice(id){

function contractClauses(d){
  const s=S.settings,t=totals(d);
  const sched=(d.schedule||'').split('\n').map(x=>x.trim()).filter(Boolean);
  const C=[
   ['1. Scope of Work',`${s.legal||s.company} ("Contractor") agrees to furnish the labor${t.mat?' and the materials listed':''} to perform the work described in the Schedule of Values above at the job address shown ("Work"). Only the items listed are included.`],
   ['2. Contract Price',`Client agrees to pay Contractor the total sum of ${money(t.total)} for the Work, subject to additions and deductions by written change order.`],
   ['3. Payment Schedule',sched.length?sched.join('; ')+'.':'Payment is due upon completion.'],
   ['4. Schedule',`Work is expected to start on or about ${fmtD(d.startDate)||'a mutually agreed date'}${d.endDate?' and be substantially completed by '+fmtD(d.endDate):''}. Dates may be extended for weather, material availability, owner or general contractor delays, changes in the Work, or other causes beyond Contractor's control.`],
   ['5. Change Orders','Any change to the Work must be agreed in writing (text or e-mail accepted) with price and time adjustment before the changed work is performed. Extra work requested on site will be billed at the rates in Contractor\'s current price list or on a time-and-material basis.'],
   ['6. Exclusions',d.exclusions||'Unless specifically listed, the following are excluded: painting, permits and engineering, electrical, plumbing, HVAC, structural repairs, and materials supplied by others.'],
   ['7. Site Conditions & Access','Client will provide clear access to the work area, electricity and water. Hidden or unforeseen conditions (rot, termite or water damage, out-of-plumb or out-of-level framing, mold) are not included and will be addressed by change order.'],
   ['8. Materials','Materials supplied by Client or others must be on site and ready when work is scheduled. Contractor is not responsible for defects in materials it did not supply. Delays caused by missing or incorrect materials may be billed.'],
   ['9. Warranty',`Contractor warrants its workmanship for ${d.warranty||s.warranty||'one year'} from substantial completion. This warranty does not cover normal wood movement, settling, moisture or humidity damage, abuse, or work altered by others. Manufacturer warranties on materials pass through to Client.`],
   ['10. Insurance',`Contractor maintains ${s.insurance||'general liability insurance'}${s.license?' and holds license/registration '+s.license:''}. Certificates available upon request.`],
   ['11. Cleanup','Contractor will keep the work area reasonably clean and remove its own debris at the end of the job unless otherwise stated.'],
   ['12. Late Payment','Payments not received within 15 days of the due date may accrue a late charge of 1.5% per month. Contractor may suspend Work until past-due amounts are paid. Client is responsible for reasonable collection costs and attorney\'s fees.'],
   ['13. Termination','Either party may terminate this Agreement upon 7 days written notice if the other party materially breaches it and fails to cure. Client will pay for all Work completed and materials ordered through the termination date.'],
   ['14. Governing Law','This Agreement is governed by the laws of the State of Florida. Venue for any dispute shall be Lee County, Florida.'],
   ['15. Entire Agreement','This Agreement, including the Schedule of Values, is the entire agreement between the parties and supersedes all prior discussions. It may only be modified in writing signed by both parties.']
  ];
  return C;
}

function emailText(d){
  const c=S.clients[d.clientId]||{},t=totals(d),K=KINDS[d.kind],s=S.settings;
  const first=(c.name||'').split(' ')[0]||'there';
  let body=`Hello ${first},\n\n`;
  if(d.kind==='estimate') body+=`Thank you for the opportunity. Please find attached Estimate #${d.number}${d.title?' for '+d.title:''}, totaling ${money(t.total)}. It is valid until ${fmtD(d.validUntil)}.\n\nTo approve, simply reply to this e-mail and we will send the contract and schedule your start date.`;
  if(d.kind==='contract') body+=`Please find attached Contract #${d.number}${d.title?' for '+d.title:''} in the amount of ${money(t.total)}.${d.depositPct?` A ${d.depositPct}% deposit (${money(t.deposit)}) is due upon signing.`:''}\n\nPlease review, sign and return it. Let us know if you have any questions.`;
  if(d.kind==='invoice') body+=`Please find attached Invoice #${d.number}${d.title?' for '+d.title:''}. Balance due: ${money(t.balance)}, due by ${fmtD(d.dueDate)}.\n\n${s.payInfo||''}`;
  body+=`\n\nThank you,\n${s.company}${s.phone?'\n'+s.phone:''}${s.email?'\n'+s.email:''}${s.website?'\n'+s.website:''}`;
  return {subject:`${K.pt==='Contrato'?'Contract':K.pt} #${d.number}${d.title?' – '+d.title:''} | ${s.company}`,body};
}

/* ---------- PDF ---------- */
function buildPdf(d){
  const {jsPDF}=window.jspdf; const pdf=new jsPDF({unit:'pt',format:'letter'});
  const s=S.settings,c=S.clients[d.clientId]||{},t=totals(d),K=KINDS[d.kind];
  const W=pdf.internal.pageSize.getWidth(),M=40;
  const NAVY=[22,21,20],AMB=[184,149,106],GR=[107,101,92];
  pdf.setFillColor(...NAVY);pdf.rect(0,0,W,78,'F');pdf.setFillColor(...AMB);pdf.rect(0,78,W,2.5,'F');
  try{pdf.addImage(LOGO_Z,'JPEG',M,14,50*LOGO_Z_SIZE[0]/LOGO_Z_SIZE[1],50);pdf.addImage(LOGO_WORD,'JPEG',M+72,27,24*LOGO_WORD_SIZE[0]/LOGO_WORD_SIZE[1],24)}catch(e){}
  pdf.setFont('times','bold');pdf.setFontSize(24);pdf.setTextColor(210,180,138);pdf.text(K.en,W-M,48,{align:'right'});
  let y=104;
  pdf.setFont('times','bold');pdf.setFontSize(12);pdf.setTextColor(...NAVY);pdf.text(s.company||'',M,y);y+=13;
  pdf.setFont('helvetica','normal');pdf.setFontSize(9);pdf.setTextColor(...GR);
  const info=[s.legal&&s.legal!==s.company?s.legal:'',s.address,s.phone,s.email,s.website,s.license?'Lic. '+s.license:''].filter(Boolean);
  info.forEach((l,i)=>pdf.text(l,M,y+i*11));y-=13;
  pdf.setTextColor(30);pdf.setFontSize(10);
  const meta=[['No.',d.number],['Date',fmtD(d.date)]];
  if(d.kind==='estimate')meta.push(['Valid until',fmtD(d.validUntil)]);
  if(d.kind==='invoice')meta.push(['Due date',fmtD(d.dueDate)]);
  if(d.sourceNumber)meta.push(['Reference',d.sourceNumber]);
  meta.forEach((m,i)=>{pdf.setFont('helvetica','bold');pdf.text(m[0]+':',W-M-110,y+i*13);pdf.setFont('helvetica','normal');pdf.text(String(m[1]||''),W-M,y+i*13,{align:'right'})});
  y+=Math.max(info.length*11,meta.length*13)+14;
  pdf.setDrawColor(...AMB);pdf.setLineWidth(1.5);pdf.line(M,y,W-M,y);y+=18;
  const colW=(W-2*M)/2;
  pdf.setFontSize(8);pdf.setTextColor(...GR);pdf.setFont('helvetica','bold');
  pdf.text(d.kind==='invoice'?'BILL TO':'CLIENT',M,y);if(d.title||d.jobAddress)pdf.text('PROJECT',M+colW,y);
  y+=13;pdf.setTextColor(30);pdf.setFontSize(10);
  const cl=[c.name,c.company,c.address,[c.city,c.state,c.zip].filter(Boolean).join(' '),c.phone,c.email].filter(Boolean);
  const pj=[d.title,...pdf.splitTextToSize(d.jobAddress||'',colW-10)].filter(Boolean);
  cl.forEach((l,i)=>{pdf.setFont('helvetica',i===0?'bold':'normal');pdf.text(String(l),M,y+i*12)});
  pj.forEach((l,i)=>{pdf.setFont('helvetica',i===0&&d.title?'bold':'normal');pdf.text(String(l),M+colW,y+i*12)});
  y+=Math.max(cl.length,pj.length)*12+12;
  pdf.autoTable({startY:y,margin:{left:M,right:M},
    head:[['Description','Qty','Unit','Rate','Amount']],
    body:d.lines.map(l=>[{content:l.name+(l.desc?'\n'+l.desc:''),styles:{}},String(l.qty),l.unit,money(l.rate),money(l.qty*l.rate)]),
    styles:{fontSize:9,cellPadding:5,valign:'top',lineColor:[226,221,211]},headStyles:{fillColor:NAVY,textColor:[210,180,138]},
    columnStyles:{0:{cellWidth:'auto'},1:{halign:'right',cellWidth:40},2:{cellWidth:38},3:{halign:'right',cellWidth:64},4:{halign:'right',cellWidth:72}},
    didParseCell:h=>{if(h.section==='body'&&h.column.index===0){h.cell.styles.fontStyle='normal'}},
    alternateRowStyles:{fillColor:[247,244,238]}});
  y=pdf.lastAutoTable.finalY+14;
  const rows=[[t.mat?'Labor':'Subtotal',money(t.labor)]];
  if(t.mat){rows.push(['Materials',money(t.mat)]);rows.push([`Sales tax (${d.taxRate}%)`,money(t.tax)])}
  if(t.disc)rows.push(['Discount','-'+money(t.disc)]);
  rows.push(['TOTAL',money(t.total)]);
  if(d.kind==='invoice'){if(t.paid)rows.push(['Paid','-'+money(t.paid)]);rows.push(['BALANCE DUE',money(t.balance)])}
  else if(d.depositPct)rows.push([`Deposit due (${d.depositPct}%)`,money(t.deposit)]);
  const ensure=h=>{if(y+h>pdf.internal.pageSize.getHeight()-50){pdf.addPage();y=50}};
  ensure(rows.length*15+10);
  rows.forEach(r=>{const b=r[0]==='TOTAL'||r[0]==='BALANCE DUE';pdf.setFont('helvetica',b?'bold':'normal');pdf.setFontSize(b?12:10);pdf.setTextColor(b?20:60);pdf.text(r[0],W-M-180,y);pdf.text(r[1],W-M,y,{align:'right'});y+=b?17:14});
  y+=8;
  const para=(title,text,opt={})=>{if(!text)return;pdf.setFontSize(opt.size||9);const lines=pdf.splitTextToSize(text,W-2*M);ensure(14+lines.length*11);pdf.setFont('helvetica','bold');pdf.setTextColor(...NAVY);if(title){pdf.text(title,M,y);y+=12}pdf.setFont('helvetica',opt.bold?'bold':'normal');pdf.setTextColor(40);lines.forEach(l=>{ensure(11);pdf.text(l,M,y);y+=11});y+=6};
  para('Notes',d.notes);
  if(d.kind==='contract'){contractClauses(d).forEach(x=>para(x[0],x[1]));
    if(d.lien){pdf.setFontSize(8);const L=pdf.splitTextToSize(LIEN,W-2*M-16);ensure(L.length*10+20);pdf.setDrawColor(20);pdf.setLineWidth(1);pdf.rect(M,y-4,W-2*M,L.length*10+14);pdf.setFont('helvetica','bold');pdf.setTextColor(20);L.forEach((l,i)=>pdf.text(l,M+8,y+8+i*10));y+=L.length*10+22}}
  para(d.kind==='contract'?'Additional Terms':'Terms',d.terms);
  if(d.kind==='invoice')para('Payment',s.payInfo);
  if(d.kind!=='invoice'){ensure(70);y+=30;pdf.setDrawColor(60);pdf.setLineWidth(.7);pdf.setFontSize(9);pdf.setFont('helvetica','normal');pdf.setTextColor(60);
    const half=(W-2*M-30)/2;
    if(d.kind==='contract'){pdf.line(M,y,M+half,y);pdf.text((s.legal||s.company)+' – Authorized Representative / Date',M,y+12);pdf.line(M+half+30,y,W-M,y);pdf.text('Client Signature / Date',M+half+30,y+12);
      y+=40;ensure(30);pdf.line(M+half+30,y,W-M,y);pdf.text('Client Printed Name',M+half+30,y+12);}
    else{pdf.line(M,y,M+half,y);pdf.text('Accepted by Client / Date',M,y+12)}}
  const n=pdf.internal.getNumberOfPages();
  for(let i=1;i<=n;i++){pdf.setPage(i);pdf.setFontSize(8);pdf.setTextColor(150);pdf.text(`${s.company} · ${K.en} #${d.number} · Page ${i} of ${n}`,W/2,pdf.internal.pageSize.getHeight()-24,{align:'center'})}
  return pdf;
}
async function downloadPdf(id){
  const d=S.docs[id];
  if(!window.jspdf){toast('Gerador de PDF não carregou. Tente recarregar a página.');return}
  try{
    const pdf=buildPdf(d); const blob=pdf.output('blob');
    const c=S.clients[d.clientId];
    const name=`${KINDS[d.kind].en.charAt(0)+KINDS[d.kind].en.slice(1).toLowerCase()} ${d.number}${c?' - '+c.name:''}.pdf`.replace(/[\\/:*?"<>|]/g,'');
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
    if(d.status==='draft'){setStatus(id,'sent')}
    toast('PDF salvo');
  }catch(e){ if(e&&e.code==='declined')return; toast('Não foi possível baixar: '+(e.message||e.code||e)) }
}
async function downloadHtml(id){
  const d=S.docs[id];
  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(d.number)}</title><style>${document.querySelector('style').textContent}body{background:#fff;padding:20px}</style></head><body>${docPreviewHtml(d)}</body></html>`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=`${d.number}.html`;a.click();toast('Arquivo salvo')
}

/* ---------- Configurações ---------- */
function vConfig(){
  const s=S.settings;
  const F=(k,l,type='text',ph='')=>`<div class="f"><label>${l}</label><input type="${type}" ${type==='number'?'step="0.01"':''} data-s="${k}" value="${esc(s[k]??'')}" placeholder="${esc(ph)}"></div>`;
  const T=(k,l,r=3)=>`<div class="f"><label>${l}</label><textarea data-s="${k}" rows="${r}">${esc(s[k]??'')}</textarea></div>`;
  return `<h1>Configurações</h1><p class="sub">Dados da empresa e padrões que aparecem nos documentos</p>
  <div class="card"><b>Empresa</b><div class="fg" style="margin-top:10px">
   ${F('company','Nome comercial')}${F('legal','Razão social (no contrato)')}${F('phone','Telefone','tel')}${F('email','E-mail','email')}${F('address','Endereço')}${F('website','Site')}${F('license','Licença / registro (opcional)','text','Ex.: Lee County BTR #')}${F('insurance','Seguro (texto no contrato)')}
  </div></div>
  <div class="card" style="margin-top:14px"><b>Padrões</b><div class="fg" style="margin-top:10px">
   ${F('taxRate','Imposto sobre materiais (%)','number')}${F('depositPct','Depósito padrão (%)','number')}${F('validDays','Validade do estimate (dias)','number')}${F('dueDays','Prazo da invoice (dias)','number')}${F('warranty','Garantia de mão de obra')}
  </div>
  ${T('payInfo','Instruções de pagamento (aparece na invoice)',2)}
  ${T('schedule','Cronograma de pagamento padrão do contrato (uma etapa por linha)',3)}
  ${T('estTerms','Termos padrão do estimate',3)}
  ${T('invTerms','Termos padrão da invoice',2)}
  </div>
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn p" onclick="saveConfig()">Salvar configurações</button></div>
  <div class="card" style="margin-top:14px"><div class="row spread"><div><b>Conta</b><div class="small muted">${esc(USER?.email||'')}</div></div><div class="row"><button class="btn" onclick="installApp()">📲 Instalar app</button><button class="btn d" onclick="logout()">Sair</button></div></div></div>
  <div class="card" style="margin-top:14px"><b>Numeração</b><p class="small muted">Próximos números: ${Object.entries(KINDS).map(([k,v])=>`${v.pre}-${s.next?.[k]||1001}`).join(' · ')}</p></div>`;
}
function saveConfig(){
  document.querySelectorAll('[data-s]').forEach(el=>{const k=el.dataset.s;S.settings[k]=el.type==='number'?(+el.value||0):el.value});
  putSettings();toast('Configurações salvas');
}

/* ---------- Modal ---------- */
function modal(html,wide){ $('#modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal ${wide?'wide':''}">${html}</div></div>`; const f=$('#modalRoot input:not([readonly]),#modalRoot select');if(f&&!('ontouchstart' in window))f.focus()}
function closeModal(){ $('#modalRoot').innerHTML='' }
function confirmDel(coll,id,label){
  modal(`<h2>Excluir ${esc(label)}?</h2><p class="muted">Essa ação não pode ser desfeita.</p><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn p" style="background:var(--bad);border-color:var(--bad)" onclick="closeModal();doDel('${coll}','${id}')">Excluir</button></div>`);
}
function doDel(coll,id){
  if(coll==='clients'&&S.clientId===id)S.clientId=null;
  if(coll==='docs'&&S.docId===id)S.docId=null;
  del(coll,id);toast('Excluído');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ---------- Instalar (PWA) ---------- */
let deferredPrompt=null;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;showInstallBtn()});
function showInstallBtn(){if(standalone||document.getElementById('instBtn'))return;const b=document.createElement('button');b.id='instBtn';b.className='btn a install';b.textContent='📲 Instalar app';b.onclick=installApp;document.body.appendChild(b)}
async function installApp(){
  if(deferredPrompt){deferredPrompt.prompt();const r=await deferredPrompt.userChoice;deferredPrompt=null;if(r.outcome==='accepted'){document.getElementById('instBtn')?.remove();toast('App instalado!')}return}
  if(standalone){toast('O app já está instalado');return}
  const mac=/Macintosh/.test(navigator.userAgent)&&!isIOS, safari=/Safari/.test(navigator.userAgent)&&!/Chrome|CriOS|Edg/.test(navigator.userAgent);
  modal(`<h2>Instalar Zeferino's CRM</h2>${isIOS?`<ol><li>Toque no botão <b>Compartilhar</b> (quadrado com seta ↑) do Safari.</li><li>Toque em <b>“Adicionar à Tela de Início”</b>.</li><li>Toque em <b>Adicionar</b>.</li></ol><p class="small muted">Precisa estar no Safari.</p>`:mac&&safari?`<ol><li>No menu, clique em <b>Arquivo → Adicionar ao Dock</b>.</li><li>Clique em <b>Adicionar</b>.</li></ol>`:`<ol><li>Clique nos <b>3 pontinhos ⋮</b> do Chrome.</li><li>Clique em <b>“Instalar Zeferino's CRM”</b> (ou “Transmitir, salvar e compartilhar → Instalar página como app”).</li></ol>`}<div class="row" style="justify-content:flex-end"><button class="btn p" onclick="closeModal()">Ok</button></div>`);
}
if(isIOS&&!standalone)setTimeout(showInstallBtn,1500);
if('serviceWorker' in navigator)navigator.serviceWorker.register('/crm/sw.js',{scope:'/crm/'}).catch(()=>{});
/* ---------- Início ---------- */
$('#lz').src=LOGO_Z;$('#lw').src=LOGO_WORD;
const h0=(location.hash||'').slice(1); if(VIEWS[h0]) S.view=h0;
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS[h]&&h!==S.view)go(h)});
render();
initDb();
</script>
