<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eva's CRM</title>
<link rel="manifest" href="/eva-crm/manifest.webmanifest?v=1">
<meta name="theme-color" content="#fdf1f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Eva's CRM">
<link rel="apple-touch-icon" sizes="180x180" href="/eva-crm/ecrm-icon-180.png?v=1">
<link rel="apple-touch-icon" href="/eva-crm/ecrm-icon-180.png?v=1">
<link rel="icon" type="image/png" sizes="192x192" href="/eva-crm/ecrm-icon-192.png?v=1">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --navy:#3a2430;--navy2:#4d3140;--amber:#d94f8c;--amber2:#b8376f;--amber-l:#f3a6c6;--bg:#fdf1f5;--card:#ffffff;
  --ink:#2b2026;--mute:#6d5e66;--line:#f0dbe4;--serif:'Playfair Display',Palatino,Georgia,serif;--ok:#1f8a4c;--warn:#b7791f;--bad:#c0392b;--info:#2b6cb0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:220px;background:#fff;color:var(--ink);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh}
.brand{padding:22px 16px 16px;border-bottom:1px solid var(--line);text-align:center}
.brand img{width:100%;display:block}
.brand .zl{width:64px;margin:0 auto 10px;border-radius:4px}
.brand span{display:block;font-size:10px;color:var(--amber2);letter-spacing:2.5px;text-transform:uppercase;margin-top:8px}
.mtop{display:none}
.mout{display:none}
.badge{background:#c0392b;color:#fff;border-radius:999px;font-size:10px;padding:1px 6px;margin-left:auto}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#5a4650;text-decoration:none;font-weight:500}
.nav a:hover{background:#fbe6ef;color:var(--navy)}
.nav a.on{background:linear-gradient(135deg,#f3a6c6,#d94f8c 60%,#b8376f);color:#fff}
.nav svg{width:18px;height:18px;flex-shrink:0}
.side .foot{margin-top:auto;padding:14px 18px;font-size:11px;color:var(--mute)}
.main{flex:1;min-width:0;padding:24px 28px 90px}
h1{font-family:var(--serif);font-size:26px;font-weight:600;margin:0 0 4px;color:var(--navy)}
.kpi .v,.modal h2{font-family:var(--serif)}
.sub{color:var(--mute);margin:0 0 20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi .l{font-size:12px;color:var(--mute);font-weight:500}
.kpi .v{font-size:24px;font-weight:700;margin-top:6px}
.kpi .s{font-size:12px;color:var(--mute);margin-top:2px}
.two{grid-template-columns:1fr 1fr}
@media(max-width:1000px){.two{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#c5cad3}
.btn.p{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.p:hover{background:var(--navy2)}
.btn.a{background:linear-gradient(135deg,#f3a6c6,#d94f8c 60%,#b8376f);border-color:#b8376f;color:#fff;font-weight:600}
.btn.a:hover{filter:brightness(1.07)}
.btn.d{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
textarea{resize:vertical;min-height:60px}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(217,79,140,.3);border-color:var(--amber)}
label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-bottom:4px}
.f{margin-bottom:12px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:#fafbfc}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:#eef0f4;color:#475467;white-space:nowrap}
.t-draft{background:#eef0f4;color:#475467}.t-sent{background:#e6effa;color:var(--info)}
.t-approved,.t-paid,.t-signed,.t-done{background:#e3f4ea;color:var(--ok)}
.t-declined,.t-cancelled,.t-overdue{background:#fbe9e7;color:var(--bad)}
.t-partial,.t-scheduled{background:#fdf3e1;color:var(--warn)}
.muted{color:var(--mute)}
.small{font-size:12px}
.empty{padding:30px;text-align:center;color:var(--mute)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--navy);border-color:var(--amber)}
.banner{background:#fff6e6;border:1px solid #f2d39a;color:#7a5410;padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:13px}
.cat-h td{background:#f8f9fb;font-weight:700;color:var(--navy);font-size:13px}
.price-in{width:90px;text-align:right;padding:5px 8px}
.lines td{padding:6px}
.lines input,.lines textarea,.lines select{padding:6px 8px}
.lines textarea{min-height:38px;font-size:12px}
.tot{margin-left:auto;max-width:340px;width:100%}
.tot div{display:flex;justify-content:space-between;padding:5px 0}
.tot .big{font-size:18px;font-weight:700;border-top:2px solid var(--navy);margin-top:6px;padding-top:8px}
.modal-bg{position:fixed;inset:0;background:rgba(15,20,35,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{max-width:900px}
.modal h2{margin:0 0 14px;font-size:18px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;z-index:60;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;font-weight:600;color:var(--mute);text-align:center;padding:4px}
.cal .d{min-height:78px;border:1px solid var(--line);border-radius:8px;padding:5px;background:#fff;cursor:pointer;font-size:12px;overflow:hidden}
.cal .d.o{background:#fafbfc;color:#b0b6c1}
.cal .d.t{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.cal .d.sel{background:#fbe6ef}
.cal .ev{display:block;margin-top:3px;padding:2px 5px;border-radius:4px;background:#e6effa;color:var(--info);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.cal .ev.svc{background:#fdf3e1;color:var(--warn)}
.cal .ev.done{background:#e3f4ea;color:var(--ok)}
.picker-list{max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.pick{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;justify-content:space-between}
.pick:hover{background:#fbe6ef}
.pick .n{font-weight:600}
.pick .r{text-align:right;white-space:nowrap;font-size:12px}
.doc-prev{border:1px solid var(--line);border-radius:10px;padding:24px;background:#fff;font-size:13px}
.doc-prev h3{margin:0;font-size:20px;color:var(--navy);font-family:var(--serif)}
.doc-head{background:#fff;border-bottom:3px solid #d94f8c;margin:-24px -24px 18px;padding:16px 24px;border-radius:10px 10px 0 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
.doc-head img{height:56px}
.doc-head .k{color:#d94f8c;font-family:var(--serif);font-size:22px;letter-spacing:2px}
.lead{border-left:3px solid var(--amber);padding:12px;background:#fff;border-radius:8px;margin-top:10px}
.clause{margin:10px 0}
.clause b{color:var(--navy)}
.lien{border:2px solid var(--ink);padding:10px;font-size:11px;font-weight:600;margin-top:14px}
.hide-m{}
.login{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#ffffff,#fdf1f5 60%,#f9d7e6);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px}
.login .box{width:100%;max-width:360px;text-align:center}
.login img{mix-blend-mode:normal}.login img.ic{width:150px;border-radius:34px;margin-bottom:14px;mix-blend-mode:normal;box-shadow:0 10px 30px rgba(0,0,0,.6)}.login img.z{width:110px;margin-bottom:14px}.login img.w{width:240px;display:block;margin:0 auto 6px}
.login .tg{color:#b8376f;letter-spacing:3px;font-size:11px;text-transform:uppercase;margin-bottom:26px}
.login input{background:#fff;border-color:#f0dbe4;color:#2b2026;margin-bottom:10px;padding:12px}
.login .btn{width:100%;padding:12px}
.login .err{color:#f0a49a;font-size:13px;min-height:18px;margin:6px 0}
.install{position:fixed;right:16px;bottom:16px;z-index:45}
@media(max-width:760px){.install{bottom:80px}}
@media(max-width:760px){
  .side{position:fixed;bottom:0;top:auto;left:0;right:0;width:100%;height:auto;z-index:40;flex-direction:row}
  .brand,.side .foot{display:none}
  .mtop{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border-bottom:1px solid var(--line);padding:10px;margin:-16px -12px 16px}
  .mtop{position:relative}
  .mout{display:block;position:absolute;right:10px;top:50%;transform:translateY(-50%);border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600}
  .mtop img{height:40px}
  .badge{position:absolute;margin-left:18px;margin-top:-4px}
  .nav a{position:relative}
  .nav{flex-direction:row;justify-content:space-around;width:100%;padding:6px 4px}
  .nav a{flex-direction:column;gap:2px;padding:6px 4px;font-size:10px;flex:1;justify-content:center;text-align:center}
  .main{padding:16px 12px 90px}
  .hide-m{display:none}
  .lines thead{display:none}
  .lines tr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;border-bottom:1px solid var(--line);padding:6px 0}
  .lines td{border:0}
  .lines td.wide{grid-column:1/-1}
}
@media(max-width:760px){
  /* barra de baixo maior: 2 fileiras de 4 botões, ícones e letras maiores */
  .nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .nav a{font-size:13.5px;font-weight:600;padding:9px 2px;gap:4px;min-height:60px}
  .nav svg{width:26px;height:26px}
  .nav .badge{position:absolute;top:4px;right:calc(50% - 26px);margin:0;font-size:11px}
  .main{padding-bottom:170px}
  .install{bottom:155px}
}
</style>
</head>

    <nav class="nav" id="nav"></nav>
    <div class="foot">Dados salvos automaticamente<br><button class="btn sm" style="margin-top:8px;width:100%" onclick="askLogout()">🚪 Sair da conta</button></div>
  </aside>
  <main class="main" id="main"></main>
</div>

const fmtD = ds=>{if(!ds)return '';const d=new Date(ds+'T12:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})};
const fmtDpt = ds=>{if(!ds)return '';const d=new Date(ds+'T12:00');return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'})};

function services(){
  const out=[];
  for(const s of CATALOG){const o=S.services[s.id]; if(o&&o.hidden) continue; out.push(o?{...s,...o,base:s}:{...s,base:s});}
  for(const o of Object.values(S.services)) if(o.custom && !o.hidden) out.push({c:'custom',...o});
  return out;
}
function svc(id){return services().find(s=>s.id===id)}

function totals(d){
  let labor=0,mat=0;
  for(const l of d.lines||[]){const a=(+l.qty||0)*(+l.rate||0); if(l.type==='material') mat+=a; else labor+=a;}
  const tax=mat*(+d.taxRate||0)/100, disc=+d.discount||0;
  const total=labor+mat+tax-disc;
  const paid=(d.payments||[]).reduce((s,p)=>s+(+p.amount||0),0);
  return {labor,mat,tax,disc,total,paid,balance:total-paid,deposit:total*(+d.depositPct||0)/100};
}

/* ---------- SMS de retorno ao lead (abre o app Mensagens já com o texto) ---------- */
function smsText(c){const first=((c.name||'').trim().split(/\s+/)[0]||'there');const n=first.charAt(0).toUpperCase()+first.slice(1).toLowerCase();
  return `Hi ${n}, this is Eva from Eva's Expert Cleaning Services. Thank you for your request! I'd be happy to schedule a visit to provide your free estimate. Which day and time work best for you this week? Looking forward to hearing from you.`}
function whoAmI(){const e=(USER&&USER.email||'').toLowerCase();return e.startsWith('evas')?'Eva':e.startsWith('zeferinos')?'Bruno':(e.split('@')[0]||'')}
function smsHref(c){let tel=(c.phone||'').replace(/[^0-9+]/g,'');if(/^\d{10}$/.test(tel))tel='+1'+tel;
  const sep=/iPhone|iPad|Macintosh/.test(navigator.userAgent)?'&':'?';return 'sms:'+tel+sep+'body='+encodeURIComponent(smsText(c))}
function markSms(id){const c=S.clients[id];if(!c||c.smsAt)return;const x=clone(c);x.smsAt=new Date().toISOString();x.smsBy=whoAmI();if(x.leadStatus==='new')x.leadStatus='contacted';put('clients',x)}

/* Toque na notificação (#sms-<id>): abre o Mensagens direto com o texto pronto.
   Se o celular não deixar abrir sozinho, mostra a janela com o botão. */
async function smsFromNotification(){const m=(location.hash||'').match(/^#sms-(\d+)$/);if(!m)return false;
  try{history.replaceState(null,'','#leads')}catch(e){}S.view='leads';
  const id='lead-'+m[1];
  for(let i=0;i<10&&!S.clients[id];i++){await importLeads(false);if(!S.clients[id])await new Promise(r=>setTimeout(r,800))}
  const c=S.clients[id];render();
  if(!c||!c.phone||!isEva())return true;
  if(c.smsAt){toast('SMS já enviado'+(c.smsBy?' por '+c.smsBy:''));return true}
  let left=false;const onHide=()=>{if(document.visibilityState==='hidden'){left=true;markSms(id)}};
  document.addEventListener('visibilitychange',onHide);
  try{location.href=smsHref(c)}catch(e){}
  setTimeout(()=>{document.removeEventListener('visibilitychange',onHide);if(!left)promptLeadSms(id)},1500);
  return true}
function isEva(){return whoAmI()==='Eva'}
function smsCheck(){if(!isEva()||document.querySelector('.modal-bg')||/^#sms-/.test(location.hash||''))return;
  const lim=Date.now()-3*864e5;
  const c=Object.values(S.clients).filter(c=>c.lead&&c.phone&&!c.smsAt&&c.leadStatus==='new'&&new Date(c.leadDate||0).getTime()>lim&&!(S.smsSkip||new Set()).has(c.id)).sort((a,b)=>(b.leadDate||'').localeCompare(a.leadDate||''))[0];

function parseForm(txt){
  const map={name:'name',nome:'name','full name':'name',phone:'phone',telefone:'phone',email:'email','e-mail':'email',city:'city',cidade:'city',address:'address','endereço':'address',service:'service','serviço':'service',servico:'service','project details':'project',details:'project',message:'project',mensagem:'project',project:'project'};
  const out={};let last=null;
  for(const line of String(txt).split(/\r?\n/)){
    const m=line.match(/^\s*([^:]{2,30}?)\s*:\s*(.*)$/);
    const k=m&&map[m[1].trim().toLowerCase()];
    if(k){out[k]=m[2].trim();last=k}
    else if(last==='project'&&line.trim()) out.project=(out.project?out.project+'\n':'')+line.trim();
  }
  return out;
}
function gmailErr(e){
  const c=e&&e.code;
  if(c==='needs_reauth') return 'Reconecte o Gmail em claude.ai → Configurações → Conectores';
  if(c==='server_not_connected'||c==='selection_required') return 'Conecte o Gmail da Zeferino\'s em claude.ai → Configurações → Conectores';
  if(c==='not_in_manifest'||c==='approval_required'||c==='consent_required') return 'Permita o acesso ao Gmail para buscar leads (clique em “Verificar e-mail agora”)';
  if(c==='server_unavailable') return 'Gmail não respondeu agora — tente de novo em instantes';
  return 'Não foi possível verificar o e-mail agora';
}
let mcp=true;
async function importLeads(manual){
  if(!USER||S.importing)return; S.importing=true; if(S.view==='leads')render();
  try{
    const {data,error}=await sb.from('leads').select('*').eq('status','new').eq('source','cleaning').order('created_at',{ascending:true}).limit(100);
    if(error) throw error;
    let added=0;
    for(const l of data||[]){
      const id='lead-'+l.id;
      if(!S.clients[id]){
        await put('clients',{id,name:l.name||'(sem nome)',phone:l.phone||'',email:l.email||'',city:l.city||'',state:'FL',address:'',service:l.service||'',project:l.details||'',source:/^Facebook/.test(l.service||'')?'Facebook (anúncio)':'Site (formulário de limpeza)',type:'Homeowner',lead:true,leadStatus:'new',leadDate:l.created_at,updatedAt:new Date().toISOString()});
        added++;
      }
      await sb.from('leads').update({status:'imported'}).eq('id',l.id);
    }
    S.leadMsg='Verificado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    if(added){toast(added+' lead(s) novo(s)!');try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
    else if(manual)toast('Nenhum lead novo');
  }catch(e){S.leadMsg='Não foi possível verificar os leads agora';if(manual)toast(S.leadMsg)}
  S.importing=false;render();
  smsCheck();
}

  const first=new Date(y,mo-1,1), start=new Date(first); start.setDate(1-first.getDay());
  const jobs=Object.values(S.jobs);
  let cells='';
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

  <div class="f"><label>Endereço da limpeza</label><input name="address" value="${esc(j.address||'')}"></div>
  <div class="f"><label>Observações</label><textarea name="notes">${esc(j.notes||'')}</textarea></div>
  <div class="f"><label><input type="checkbox" name="done" style="width:auto" ${j.status==='done'?'checked':''}> Concluído</label></div>
  <div class="row spread"><div>${id?`<button type="button" class="btn d" onclick="confirmDel('jobs','${id}','este agendamento')">Excluir</button>`:''}</div><div class="row"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn p">Salvar</button></div></div></form>`);
  $('#jf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);
    for(const k of ['clientId','type','title','date','time','address','notes']) j[k]=(f.get(k)||'').trim();
    j.status=f.get('done')?'done':'scheduled';
    const extra=[];
    const rep=f.get('repeat'), times=Math.min(52,Math.max(2,+f.get('times')||12));
    if(rep&&!id){ // recurring cleaning: create the following visits
      const g=j.id; j.group=g; j.repeat=rep;
      for(let k=1;k<times;k++){let d;
        if(rep==='m'){const x=new Date(j.date+'T12:00');x.setMonth(x.getMonth()+k);d=x.toISOString().slice(0,10)} else d=addDays(j.date,(+rep)*k);
        extra.push({...j,id:g+'-'+k,date:d,status:'scheduled'})}
    }
    put('jobs',j); extra.forEach(x=>put('jobs',x)); closeModal(); toast(extra.length?(extra.length+1)+' limpezas agendadas':'Agendamento salvo')};
}

async function newDoc(kind,clientId,from){
  const st=S.settings, t=today();
  const d=from?clone(from):{lines:[],taxRate:st.taxRate,depositPct:st.depositPct,discount:0};
  d.id=uid(); d.kind=kind; d.status='draft'; d.date=t; d.payments=[];
  d.clientId=clientId||d.clientId||'';
  if(from){d.sourceId=from.id; d.sourceNumber=from.number}
  if(!d.jobAddress&&d.clientId){const c=S.clients[d.clientId];if(c)d.jobAddress=[c.address,c.city,c.state,c.zip].filter(Boolean).join(', ')}
  if(kind==='estimate'){d.validUntil=addDays(t,+st.validDays||30);d.terms=st.estTerms}
  if(kind==='contract'){d.terms='';d.schedule=st.schedule;d.startDate=d.startDate||addDays(t,7);d.lien=false;d.warranty=st.warranty;d.frequency=d.frequency||''}
  if(kind==='invoice'){d.dueDate=addDays(t,+st.dueDays||15);d.terms=st.invTerms}
  d.number='(novo)';
  S.view='documentos';S.docTab=kind;S.docId=null;S.edit=d;closeModal();render();window.scrollTo(0,0);
}

async function saveEdit(){

   ['2. Price & Frequency',`The price per the Schedule of Services is ${money(t.total)}${d.frequency?' per visit, on a '+d.frequency+' basis':''}. Prices are based on the home's size and condition at the walkthrough and may be adjusted with notice if they change.`],
   ['3. Payment',(sched.length?sched.join('; ')+'. ':'')+'Payments not received within 7 days of the due date may incur a late fee of $25 and service may be paused until the balance is paid.'],
   ['4. Schedule & Access',`Service begins on or about ${fmtD(d.startDate)||'a mutually agreed date'}. Client will provide access to the home (key, code or someone present) and inform the Company of any alarm system. Utilities (water and electricity) must be on.`],
   ['5. Cancellations & Lockouts','Client agrees to give at least 24 hours notice to cancel or reschedule. Late cancellations, or visits where the cleaner cannot enter the home, may be charged a lockout fee of up to 50% of the visit price.'],
   ['6. Satisfaction Guarantee',`${d.warranty||s.warranty||'24-hour satisfaction guarantee'}: if any area is not cleaned to Client's satisfaction, Client must notify the Company within 24 hours and the Company will re-clean that area at no charge.`],
   ['7. Exclusions & Safety',d.exclusions||'Services do not include: biohazards (bodily fluids, mold, pest infestations), exterior windows or work above a standard step ladder, moving heavy furniture, carpet shampooing, or cleaning that requires special equipment, unless listed.'],
   ['8. Pets & Valuables','Client will secure pets during the visit and inform the Company of any pet concerns. Money, jewelry and valuables should be put away; the Company is not responsible for items left out.'],
   ['9. Breakage & Damage','The Company carries '+(s.insurance||'general liability insurance')+'. Any damage must be reported within 24 hours. The Company is not responsible for normal wear, improperly secured items or pre-existing damage.'],
   ['10. Supplies','Unless otherwise agreed, the Company supplies its own cleaning products and equipment. If Client requests specific products, Client will provide them.'],
   ['11. Term & Termination','For recurring service, either party may end this Agreement at any time with 7 days notice. Client will pay for all services completed.'],
   ['12. Governing Law','This Agreement is governed by the laws of the State of Florida. Venue for any dispute shall be Collier County, Florida.'],
   ['13. Entire Agreement','This Agreement, including the Schedule of Services, is the entire agreement between the parties and may only be changed in writing (text or e-mail accepted).']
  ];
}

function emailText(d){
  const c=docCli(d),t=totals(d),K=KINDS[d.kind],s=S.settings;
  const first=(c.name||'').split(' ')[0]||'there';
  let body=`Hello ${first},\n\n`;
  if(d.kind==='estimate') body+=`Thank you for contacting Eva's Expert Cleaning Services! Please find attached Quote #${d.number}${d.title?' for '+d.title:''}, totaling ${money(t.total)}. It is valid until ${fmtD(d.validUntil)}.\n\nTo approve, simply reply to this e-mail and we will confirm your cleaning date.`;
  if(d.kind==='contract') body+=`Please find attached Service Agreement #${d.number}${d.title?' for '+d.title:''} in the amount of ${money(t.total)}.${d.depositPct?` A ${d.depositPct}% deposit (${money(t.deposit)}) is due upon signing.`:''}\n\nPlease review, sign and return it. Let us know if you have any questions.`;
  if(d.kind==='invoice') body+=`Please find attached Invoice #${d.number}${d.title?' for '+d.title:''}. Balance due: ${money(t.balance)}, due by ${fmtD(d.dueDate)}.\n\n${s.payInfo||''}`;

/* ---------- PDF ---------- */
function buildPdf(d){
  const {jsPDF}=window.jspdf; const pdf=new jsPDF({unit:'pt',format:'letter'});
  const s=S.settings,c=docCli(d),t=totals(d),K=KINDS[d.kind];
  const W=pdf.internal.pageSize.getWidth(),M=40;
  const NAVY=[58,36,48],AMB=[217,79,140],GR=[109,94,102];
  pdf.setFillColor(253,241,245);pdf.rect(0,0,W,78,'F');pdf.setFillColor(...AMB);pdf.rect(0,78,W,2.5,'F');
  try{pdf.addImage(LOGO_EVA,'PNG',M,8,62*LOGO_EVA_SIZE[0]/LOGO_EVA_SIZE[1],62)}catch(e){}
  pdf.setFont('times','bold');pdf.setFontSize(K.en.length>12?18:24);pdf.setTextColor(...AMB);pdf.text(K.en,W-M,48,{align:'right'});
  let y=104;
  pdf.setFont('times','bold');pdf.setFontSize(12);pdf.setTextColor(...NAVY);pdf.text(s.company||'',M,y);y+=13;
  pdf.setFont('helvetica','normal');pdf.setFontSize(9);pdf.setTextColor(...GR);
  const info=[s.legal&&s.legal!==s.company?s.legal:'',s.address,s.phone,s.email,s.website,s.license?'Lic. '+s.license:''].filter(Boolean);
  info.forEach((l,i)=>pdf.text(l,M,y+i*11));y-=13;
  pdf.setTextColor(30);pdf.setFontSize(10);
  const meta=[['No.',d.number],['Date',fmtD(d.date)]];
  if(d.kind==='estimate')meta.push(['Valid until',fmtD(d.validUntil)]);
  if(d.kind==='invoice')meta.push(['Due date',fmtD(d.dueDate)]);
  if(d.sourceNumber)meta.push(['Reference',d.sourceNumber]);
  meta.forEach((m,i)=>{pdf.setFont('helvetica','bold');pdf.text(m[0]+':',W-M-110,y+i*13);pdf.setFont('helvetica','normal');pdf.text(String(m[1]||''),W-M,y+i*13,{align:'right'})});
  y+=Math.max(info.length*11,meta.length*13)+14;
  pdf.setDrawColor(...AMB);pdf.setLineWidth(1.5);pdf.line(M,y,W-M,y);y+=18;
  const colW=(W-2*M)/2;
  pdf.setFontSize(8);pdf.setTextColor(...GR);pdf.setFont('helvetica','bold');
  pdf.text(d.kind==='invoice'?'BILL TO':'CLIENT',M,y);if(d.title||d.jobAddress)pdf.text('SERVICE',M+colW,y);
  y+=13;pdf.setTextColor(30);pdf.setFontSize(10);
  const cl=[c.name,c.company,c.address,[c.city,c.state,c.zip].filter(Boolean).join(' '),c.phone,c.email].filter(Boolean);
  const pj=[d.title,...pdf.splitTextToSize(d.jobAddress||'',colW-10)].filter(Boolean);
  cl.forEach((l,i)=>{pdf.setFont('helvetica',i===0?'bold':'normal');pdf.text(String(l),M,y+i*12)});
  pj.forEach((l,i)=>{pdf.setFont('helvetica',i===0&&d.title?'bold':'normal');pdf.text(String(l),M+colW,y+i*12)});
  y+=Math.max(cl.length,pj.length)*12+12;
  pdf.autoTable({startY:y,margin:{left:M,right:M},
    head:[['Description','Qty','Unit','Rate','Amount']],
    body:d.lines.map(l=>[{content:l.name+(l.desc?'\n'+l.desc:''),styles:{}},String(l.qty),l.unit,money(l.rate),money(l.qty*l.rate)]),
    styles:{fontSize:9,cellPadding:5,valign:'top',lineColor:[240,219,228]},headStyles:{fillColor:[217,79,140],textColor:255},
    columnStyles:{0:{cellWidth:'auto'},1:{halign:'right',cellWidth:40},2:{cellWidth:38},3:{halign:'right',cellWidth:64},4:{halign:'right',cellWidth:72}},
    didParseCell:h=>{if(h.section==='body'&&h.column.index===0){h.cell.styles.fontStyle='normal'}},
    alternateRowStyles:{fillColor:[253,241,245]}});
  y=pdf.lastAutoTable.finalY+14;
  const rows=[[t.mat?'Labor':'Subtotal',money(t.labor)]];
  if(t.mat){rows.push(['Materials',money(t.mat)]);rows.push([`Sales tax (${d.taxRate}%)`,money(t.tax)])}
  if(t.disc)rows.push(['Discount','-'+money(t.disc)]);
  rows.push(['TOTAL',money(t.total)]);
  if(d.kind==='invoice'){if(t.paid)rows.push(['Paid','-'+money(t.paid)]);rows.push(['BALANCE DUE',money(t.balance)])}
  else if(d.depositPct)rows.push([`Deposit due (${d.depositPct}%)`,money(t.deposit)]);
  const ensure=h=>{if(y+h>pdf.internal.pageSize.getHeight()-50){pdf.addPage();y=50}};
  ensure(rows.length*15+10);
  rows.forEach(r=>{const b=r[0]==='TOTAL'||r[0]==='BALANCE DUE';pdf.setFont('helvetica',b?'bold':'normal');pdf.setFontSize(b?12:10);pdf.setTextColor(b?20:60);pdf.text(r[0],W-M-180,y);pdf.text(r[1],W-M,y,{align:'right'});y+=b?17:14});
  y+=8;
  const para=(title,text,opt={})=>{if(!text)return;pdf.setFontSize(opt.size||9);const lines=pdf.splitTextToSize(text,W-2*M);ensure(14+lines.length*11);pdf.setFont('helvetica','bold');pdf.setTextColor(...NAVY);if(title){pdf.text(title,M,y);y+=12}pdf.setFont('helvetica',opt.bold?'bold':'normal');pdf.setTextColor(40);lines.forEach(l=>{ensure(11);pdf.text(l,M,y);y+=11});y+=6};
  para('Notes',d.notes);
  if(d.kind==='contract'){contractClauses(d).forEach(x=>para(x[0],x[1]));
    if(d.lien){pdf.setFontSize(8);const L=pdf.splitTextToSize(LIEN,W-2*M-16);ensure(L.length*10+20);pdf.setDrawColor(20);pdf.setLineWidth(1);pdf.rect(M,y-4,W-2*M,L.length*10+14);pdf.setFont('helvetica','bold');pdf.setTextColor(20);L.forEach((l,i)=>pdf.text(l,M+8,y+8+i*10));y+=L.length*10+22}}
  para(d.kind==='contract'?'Additional Terms':'Terms',d.terms);
  if(d.kind==='invoice')para('Payment',s.payInfo);
  if(d.kind!=='invoice'){ensure(70);y+=30;pdf.setDrawColor(60);pdf.setLineWidth(.7);pdf.setFontSize(9);pdf.setFont('helvetica','normal');pdf.setTextColor(60);
    const half=(W-2*M-30)/2;
    if(d.kind==='contract'){pdf.line(M,y,M+half,y);pdf.text((s.legal||s.company)+' – Authorized Representative / Date',M,y+12);pdf.line(M+half+30,y,W-M,y);pdf.text('Client Signature / Date',M+half+30,y+12);
      y+=40;ensure(30);pdf.line(M+half+30,y,W-M,y);pdf.text('Client Printed Name',M+half+30,y+12);}
    else{pdf.line(M,y,M+half,y);pdf.text('Accepted by Client / Date',M,y+12)}}
  const n=pdf.internal.getNumberOfPages();
  for(let i=1;i<=n;i++){pdf.setPage(i);pdf.setFontSize(8);pdf.setTextColor(150);pdf.text(`${s.company} · ${K.en} #${d.number} · Page ${i} of ${n}`,W/2,pdf.internal.pageSize.getHeight()-24,{align:'center'})}
  return pdf;
}
/* ---------- Prévia do PDF ---------- */
let _pdfjs=null;
function loadScript(src){return new Promise((ok,bad)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=bad;document.head.appendChild(s)})}
async function getPdfjs(){
  if(_pdfjs)return _pdfjs;
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  return _pdfjs=window.pdfjsLib;
}
async function previewPdf(d){
  if(!d)return;
  if(!window.jspdf){toast('Gerador de PDF não carregou. Recarregue a página.');return}
  if(!d.lines||!d.lines.length){toast('Adicione pelo menos um item para ver a prévia');return}
  const saved=!!S.docs[d.id]&&d.number!=='(novo)';
  modal(`<h2>Prévia – ${KINDS[d.kind].pt}${d.avulso?' avulsa':''} ${esc(d.number==='(novo)'?'(número sai ao salvar)':d.number)}</h2>
  <p class="small muted" style="margin-top:-8px">É assim que o cliente vai ver o arquivo PDF.</p>
  <div id="pv" style="background:#f4e4eb;border-radius:10px;padding:10px;max-height:70vh;overflow:auto;text-align:center"><div class="empty">Gerando prévia…</div></div>
  <div class="row" style="justify-content:flex-end;margin-top:12px;gap:8px">
   <button class="btn" onclick="closeModal()">${saved?'Fechar':'Voltar e editar'}</button>
   ${saved?`<button class="btn" onclick="closeModal();copyEmail('${d.id}')">Copiar e-mail</button><button class="btn p" onclick="downloadPdf('${d.id}')">Baixar PDF</button>`:`<button class="btn p" onclick="closeModal();saveEdit()">Está certo — Salvar</button>`}
  </div>`,true);
  try{
    const bytes=buildPdf(d).output('arraybuffer');
    const lib=await getPdfjs();
    const doc=await lib.getDocument({data:new Uint8Array(bytes)}).promise;
    const box=document.getElementById('pv'); if(!box)return; box.innerHTML='';
    const w=Math.min(box.clientWidth-20,820);
    for(let i=1;i<=doc.numPages;i++){
      const pg=await doc.getPage(i);const v1=pg.getViewport({scale:1});
      const scale=w/v1.width, dpr=Math.min(window.devicePixelRatio||1,2);
      const vp=pg.getViewport({scale:scale*dpr});
      const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;c.style.width=w+'px';c.style.height=(vp.height/dpr)+'px';c.style.background='#fff';c.style.boxShadow='0 4px 14px rgba(0,0,0,.18)';c.style.margin='0 auto 12px';c.style.display='block';
      box.appendChild(c);
      await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    }
  }catch(e){
    const box=document.getElementById('pv');
    if(box) box.innerHTML='<div class="doc-prev" style="text-align:left">'+docPreviewHtml(d)+'</div>';
  }
}
async function downloadPdf(id){
  const d=S.docs[id];
  if(!window.jspdf){toast('Gerador de PDF não carregou. Tente recarregar a página.');return}
  try{
    const pdf=buildPdf(d); const blob=pdf.output('blob');
    const c=docCli(d);
    const name=`${KINDS[d.kind].en.charAt(0)+KINDS[d.kind].en.slice(1).toLowerCase()} ${d.number}${c?' - '+c.name:''}.pdf`.replace(/[\\/:*?"<>|]/g,'');
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
    if(d.status==='draft'){setStatus(id,'sent')}
    toast('PDF salvo');
  }catch(e){ if(e&&e.code==='declined')return; toast('Não foi possível baixar: '+(e.message||e.code||e)) }
}
async function downloadHtml(id){
  const d=S.docs[id];
  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(d.number)}</title><style>${document.querySelector('style').textContent}body{background:#fff;padding:20px}</style></head><body>${docPreviewHtml(d)}</body></html>`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=`${d.number}.html`;a.click();toast('Arquivo salvo')
}

/* ---------- Configurações ---------- */

  const T=(k,l,r=3)=>`<div class="f"><label>${l}</label><textarea data-s="${k}" rows="${r}">${esc(s[k]??'')}</textarea></div>`;
  return `<h1>Configurações</h1><p class="sub">Dados da empresa e padrões que aparecem nos documentos</p>
  <div class="card"><b>Empresa</b><div class="fg" style="margin-top:10px">
   ${F('company','Nome comercial')}${F('legal','Razão social (no contrato)')}${F('phone','Telefone','tel')}${F('email','E-mail','email')}${F('address','Endereço')}${F('website','Site')}${F('license','Licença / registro (opcional)','text','Ex.: Collier County BTR #')}${F('insurance','Seguro (texto no contrato)')}
  </div></div>
  <div class="card" style="margin-top:14px"><b>Padrões</b><div class="fg" style="margin-top:10px">
   ${F('taxRate','Imposto sobre produtos/material (%)','number')}${F('depositPct','Depósito padrão (%)','number')}${F('validDays','Validade do orçamento (dias)','number')}${F('dueDays','Prazo da invoice (dias)','number')}${F('warranty','Garantia de satisfação')}
  </div>
  ${T('payInfo','Instruções de pagamento (aparece na invoice)',2)}
  ${T('schedule','Cronograma de pagamento padrão do contrato (uma etapa por linha)',3)}
  ${T('estTerms','Termos padrão do orçamento',3)}
  ${T('invTerms','Termos padrão da invoice',2)}
  </div>
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn p" onclick="saveConfig()">Salvar configurações</button></div>
  <div class="card" style="margin-top:14px"><div class="row spread"><div><b>Conta</b><div class="small muted">${esc(USER?.email||'')}</div></div><div class="row">${pushBtn()}<button class="btn" onclick="installApp()">📲 Instalar app</button><button class="btn d" onclick="askLogout()">Sair da conta</button></div></div></div>
  <div class="card" style="margin-top:14px"><b>Numeração</b><p class="small muted">Próximos números: ${Object.entries(KINDS).map(([k,v])=>`${v.pre}-${s.next?.[k]||1001}`).join(' · ')}</p></div>`;
}
function saveConfig(){
  document.querySelectorAll('[data-s]').forEach(el=>{const k=el.dataset.s;S.settings[k]=el.type==='number'?(+el.value||0):el.value});
  putSettings();toast('Configurações salvas');
}

/* ---------- Modal ---------- */
function modal(html,wide){ $('#modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal ${wide?'wide':''}">${html}</div></div>`; const f=$('#modalRoot input:not([readonly]),#modalRoot select');if(f&&!('ontouchstart' in window))f.focus()}
function closeModal(){ $('#modalRoot').innerHTML='' }
function confirmDel(coll,id,label){
  modal(`<h2>Excluir ${esc(label)}?</h2><p class="muted">Essa ação não pode ser desfeita.</p><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn p" style="background:var(--bad);border-color:var(--bad)" onclick="closeModal();doDel('${coll}','${id}')">Excluir</button></div>`);
}
function doDel(coll,id){
  if(coll==='clients'&&S.clientId===id)S.clientId=null;
  if(coll==='docs'&&S.docId===id)S.docId=null;
  del(coll,id);toast('Excluído');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ---------- Notificações ---------- */
const VAPID_PUBLIC='BLaOpAHxXjQqAw2b4oXH9isncMoXRBKtzjjV0cOyZLfs53hBpSP2GQH3kR9yMTt_tu64vzlFGkTYhHEDdyPTyNA';
function pushSupported(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
function pushState(){if(!pushSupported())return 'unsupported';return Notification.permission==='granted'&&S.pushOn?'on':Notification.permission}
function b64u(s){const p='='.repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...b].map(c=>c.charCodeAt(0)))}
async function syncPush(ask){
  if(!pushSupported()||!USER)return false;
  if(Notification.permission!=='granted'){ if(!ask)return false; const p=await Notification.requestPermission(); if(p!=='granted'){toast('Notificações bloqueadas. Libere em Ajustes → Notificações → Eva\'s CRM');render();return false} }
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
  const {error}=await sb.from('push_subs').upsert({endpoint:sub.endpoint,owner:USER.id,sub:sub.toJSON(),app:'eva'},{onConflict:'endpoint'});
  if(error){if(ask)toast('Erro ao ativar: '+error.message);return false}
  S.pushOn=true;render();return true;
}
async function enablePush(){
  if(!pushSupported()){
    if(isIOS&&!standalone){modal(`<h2>Ativar notificações</h2><p>No iPhone, as notificações só funcionam com o CRM aberto pelo <b>ícone na tela de início</b>.</p><p class="muted">Abra o app pelo ícone Eva's CRM e toque de novo em “Ativar notificações”.</p><div class="row" style="justify-content:flex-end"><button class="btn p" onclick="closeModal()">Ok</button></div>`)}
    else toast('Este aparelho/navegador não aceita notificações. Use o app instalado pelo Safari (iPhone) ou Chrome.');
    return;
  }
  try{ if(await syncPush(true)) toast('🔔 Notificações ativadas neste aparelho!') }catch(e){toast('Não foi possível ativar: '+(e.message||e))}
}
function pushBtn(){const st=pushState();return st==='on'?`<span class="tag t-done">🔔 Notificações ativas</span>`:`<button class="btn a" onclick="enablePush()">🔔 Ativar notificações</button>`}

/* ---------- Instalar (PWA) ---------- */
let deferredPrompt=null;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;showInstallBtn()});
function showInstallBtn(){if(standalone||document.getElementById('instBtn'))return;const b=document.createElement('button');b.id='instBtn';b.className='btn a install';b.textContent='📲 Instalar app';b.onclick=installApp;document.body.appendChild(b)}
async function installApp(){
  if(deferredPrompt){deferredPrompt.prompt();const r=await deferredPrompt.userChoice;deferredPrompt=null;if(r.outcome==='accepted'){document.getElementById('instBtn')?.remove();toast('App instalado!')}return}
  if(standalone){toast('O app já está instalado');return}
  const mac=/Macintosh/.test(navigator.userAgent)&&!isIOS, safari=/Safari/.test(navigator.userAgent)&&!/Chrome|CriOS|Edg/.test(navigator.userAgent);
  modal(`<h2>Instalar Eva's CRM</h2>${isIOS?`<ol><li>Toque no botão <b>Compartilhar</b> (quadrado com seta ↑) do Safari.</li><li>Toque em <b>“Adicionar à Tela de Início”</b>.</li><li>Toque em <b>Adicionar</b>.</li></ol><p class="small muted">Precisa estar no Safari.</p>`:mac&&safari?`<ol><li>No menu, clique em <b>Arquivo → Adicionar ao Dock</b>.</li><li>Clique em <b>Adicionar</b>.</li></ol>`:`<ol><li>Clique nos <b>3 pontinhos ⋮</b> do Chrome.</li><li>Clique em <b>“Instalar Eva's CRM”</b> (ou “Transmitir, salvar e compartilhar → Instalar página como app”).</li></ol>`}<div class="row" style="justify-content:flex-end"><button class="btn p" onclick="closeModal()">Ok</button></div>`);
}
if(isIOS&&!standalone)setTimeout(showInstallBtn,1500);
if('serviceWorker' in navigator)navigator.serviceWorker.register('/eva-crm/sw.js',{scope:'/eva-crm/'}).catch(()=>{});

window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS[h]&&h!==S.view)go(h)});
render();
initDb();
